name: Deploy Infra and Datadog Monitor

on:
  push:
    branches:
      - stg  

jobs:
  terraform:
    name: 'Deploy Infra and Datadog Monitors'
    runs-on: ubuntu-latest

    env:
      # Sensitive
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
      TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN}}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID}}
      TF_VAR_db_user_password_v1: ${{ secrets.DB_USER_PASSWORD_V1}}
      TF_VAR_credentials_file: ${{ secrets.GCP_SA_KEY}}
      # Non-sensitive
      TF_VAR_environment: ${{vars.ENVIRONMENT}} 
      TF_VAR_project_id: ${{vars.PROJECT_ID}}
      TF_VAR_project_region: ${{vars.PROJECT_REGION}}
      TF_VAR_project_zone: ${{vars.PROJECT_ZONE}}
      TF_VAR_backend_github_repo: ${{vars.BACKEND_GITHUB_REPO}}
      TF_VAR_frontend_github_repo: ${{vars.FRONTEND_GITHUB_REPO}}
      TF_VAR_domain: ${{vars.DOMAIN}}


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # - name: Enable Terraform Debug Logs
      #   run: echo "TF_LOG=DEBUG" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./envs/stg
        run: terraform init
      
      - name: Terraform Validate
        working-directory: ./envs/stg
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./envs/stg
        run: terraform plan  
        timeout-minutes: 8

      - name: Terraform Apply
        working-directory: ./envs/stg
        run: terraform apply -auto-approve
